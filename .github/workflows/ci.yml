name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  lint-and-typecheck:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn lint
      - run: yarn format:check
      - run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn test

  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image as `yarn test:visual`, so visual snapshots render identically.
    # Keep the tag in sync with @playwright/test (package.json scripts use it too).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # No-op when the image matches @playwright/test; downloads browsers if they drift
      - run: npx playwright install chromium webkit firefox
      - run: yarn build
        env:
          # The build only needs a non-empty key; E2E tests never send real email
          RESEND_API_KEY: re_dummy_ci_build
      # Firefox requires the home directory to belong to the container's current user.
      - run: chown "$(id -u):$(id -g)" "$HOME"
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v7
        # A green job can still contain failed attempts that passed on retry.
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn build
        env:
          RESEND_API_KEY: re_dummy_ci_build
      # Budgets live in lighthouserc.cjs; the runner image already has Chrome
      - run: npx -y @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          # upload-artifact skips dot-folders unless told otherwise
          include-hidden-files: true
          retention-days: 14

  deploy:
    name: Deploy to Vercel
    needs: [lint-and-typecheck, unit-tests, e2e-tests, lighthouse]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx vercel@62.4.0 pull --yes --environment=production
      - run: npx vercel@62.4.0 build --prod
      - run: npx vercel@62.4.0 deploy --prebuilt --prod
