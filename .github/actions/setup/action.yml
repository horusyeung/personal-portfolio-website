name: Setup
description: Node from .nvmrc, Yarn pinned by packageManager via Corepack, cached immutable install

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    # Corepack must be enabled before any Yarn command so the pinned version is used
    - run: corepack enable
      shell: bash

    - name: Verify Yarn version
      shell: bash
      run: |
        expected="$(node -p "require('./package.json').packageManager.split('@')[1]")"
        actual="$(yarn --version)"
        echo "Yarn $actual (expected $expected)"
        test "$actual" = "$expected"

    - uses: actions/cache@v6
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-

    - run: yarn install --immutable
      shell: bash
